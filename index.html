    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png?h=d67b25faafe801c38768d86d01e2499a">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png?h=d67b25faafe801c38768d86d01e2499a">

    <link rel="icon" type="image/png" sizes="128x128" href="assets/img/favicon-128x128.png?h=d67b25faafe801c38768d86d01e2499a">

</head>

<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3"><button class="btn btn-primary" id="prevMonth" type="button">&lt;</button>
            <h4 id="currentMonth"></h4><button class="btn btn-primary" id="nextMonth" type="button">&gt;</button>
        </div>
        <div class="d-flex align-items-center flex-wrap"><button class="btn btn-success me-2 mb-2" id="addEntryBtn" type="button">+ Add Entry</button><button class="btn btn-secondary me-2 mb-2" id="addMethodBtn" type="button">+ Add Payment Method</button><button class="btn btn-warning me-2 mb-2" id="exportBtn" type="button">Export Data</button><button class="btn btn-danger me-2 mb-2" id="importBtn" type="button">Import Data</button><input type="file" id="importFileInput" accept=".json" hidden=""></div>
        <div id="methodsContainer"></div>
        <div class="mt-4">
            <h4>Due :&nbsp;<span id="dueAmount">RM 0.00</span></h4>
            <h5>Paid&nbsp; :&nbsp;&nbsp;<span id="paidAmount">RM&nbsp; 0.00</span></h5>
            <h5>Total :&nbsp;&nbsp;<span id="totalAmount">RM&nbsp; 0.00</span></h5>
        </div>
    </div>
    <div class="modal fade" role="dialog" tabindex="-1" id="methodModal">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="methodModalLabel">Add Payment Method</h5><button class="btn-close" type="button" aria-label="Close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body"><input type="text" id="methodName" class="form-control" placeholder="Example : Maybank" required=""></div>
                <div class="modal-footer"><button class="btn btn-primary" id="saveMethod" type="button">Save</button></div>
            </div>
        </div>
    </div>
    <div class="modal fade" role="dialog" tabindex="-1" id="entryModal">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="entryModalLabel">Add Entry</h5><button class="btn-close" type="button" aria-label="Close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><select id="entryMethod" class="form-select" required=""></select></div>
                    <div class="mb-3"><input type="text" id="entryItem" class="form-control" placeholder="Name" required=""></div>
                    <div class="mb-3"><input type="number" id="entryAmount" class="form-control" placeholder="Amount" required=""></div>
                    <div class="mb-3"><input type="number" id="entryDueDay" class="form-control" placeholder="Due Day (1-31)" min="1" max="31" required=""></div>
                </div>
                <div class="modal-footer"><button class="btn btn-primary" id="saveEntry" type="button">Save</button></div>
            </div>
        </div>
    </div>
    <footer class="text-center bg-body py-4">
        <div class="container">
            <div class="row row-cols-1 row-cols-lg-3">
                <div class="col">
                    <p class="text-body my-2">Payment Tracker v1.1</p>
                </div>
                <div class="col">
                    <ul class="list-inline my-2">
                        <li class="list-inline-item me-4"></li>
                        <li class="list-inline-item me-4"></li>
                        <li class="list-inline-item"></li>
                    </ul>
                </div>
                <div class="col">
                    <p class="text-body my-2">Created by MatrixEvo on 7th July 2025</p>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>

    <script src="assets/js/script.js?h=a60008e16f380ec4aa29045cd2bb562a"></script>
</body>

</html>
